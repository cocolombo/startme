{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Dashboard</title>
    <script src="{% static 'js/tailwind.js' %}"></script>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-lg shadow-lg p-8">
        <h1 class="text-xl font-semibold text-white mb-6 text-center">Connexion</h1>

        {% if form.errors %}
        <div class="mb-4 rounded bg-red-900/40 border border-red-700 text-red-300 text-sm px-3 py-2">
            Identifiant ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-sm text-gray-400 mb-1">Identifiant</label>
                <input type="text" name="username" id="id_username" autofocus required
                       class="w-full rounded bg-gray-900 border border-gray-700 px-3 py-2 text-sm
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="id_password" class="block text-sm text-gray-400 mb-1">Mot de passe</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full rounded bg-gray-900 border border-gray-700 px-3 py-2 text-sm
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded px-3 py-2
                           text-sm transition-colors">
                Se connecter
            </button>
        </form>
    </div>

</body>
</html>
