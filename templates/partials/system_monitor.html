<div class="h-full flex flex-col justify-between text-xs">
    
    <div class="grid grid-cols-3 gap-2 mb-2 border-b border-gray-700 pb-2">
        
        <div class="text-center">
            <div class="text-gray-300 font-bold mb-1">CPU</div>
            <div class="relative w-full bg-gray-700 rounded-full h-2 mb-1">
                <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: {{ cpu_usage }}%"></div>
            </div>
            <span class="text-white">{{ cpu_usage }}%</span>
        </div>

        <div class="text-center">
            <div class="text-gray-300 font-bold mb-1">RAM</div>
            <div class="relative w-full bg-gray-700 rounded-full h-2 mb-1">
                <div class="bg-purple-500 h-2 rounded-full transition-all duration-500" style="width: {{ ram_percent }}%"></div>
            </div>
            <span class="text-white">{{ ram_used_gb }} Go</span>
        </div>

        {% if gpu %}
        <div class="text-center">
            <div class="text-gray-300 font-bold mb-1">GPU <span class="text-[10px] text-orange-400">{{ gpu.temp }}°C</span></div>
            <div class="relative w-full bg-gray-700 rounded-full h-2 mb-1">
                <div class="bg-green-500 h-2 rounded-full transition-all duration-500" style="width: {{ gpu.percent }}%"></div>
            </div>
            <span class="text-white">{{ gpu.used }} MiB</span>
        </div>
        {% else %}
        <div class="text-center flex items-center justify-center text-gray-300 italic">
            No GPU
        </div>
        {% endif %}
    </div>

    <div class="space-y-1 overflow-y-auto pr-1 custom-scrollbar font-mono text-[10px]">
        <div class="flex justify-between text-gray-500 border-b border-gray-700 pb-1 mb-1">
            <span>Périphérique</span>
            <span class="flex gap-3"><span>Total</span><span>Utilisé</span><span>Libre</span><span>%</span></span>
        </div>
        {% for disk in disks %}
        <div class="flex justify-between items-center">
            <span class="text-gray-400 truncate max-w-[55%]" title="{{ disk.device }}">{{ disk.device }}</span>
            <span class="flex gap-3 text-right whitespace-nowrap">
                <span class="text-gray-300 w-10 text-right">{{ disk.total_gb }}G</span>
                <span class="text-white w-10 text-right">{{ disk.used_gb }}G</span>
                <span class="text-gray-300 w-10 text-right">{{ disk.free_gb }}G</span>
                <span class="w-8 text-right {% if disk.percent > 90 %}text-red-400{% elif disk.percent > 75 %}text-yellow-400{% else %}text-blue-400{% endif %}">{{ disk.percent }}%</span>
            </span>
        </div>
        {% endfor %}
    </div>

</div>
