<!-- Backdrop -->
<div id="sidebar-backdrop"
     class="fixed inset-0 bg-black/60 z-40 hidden"
     onclick="closeSidebar()">
</div>

<!-- Sidebar drawer -->
<aside id="sidebar-menu"
       class="fixed top-0 left-0 h-full w-64 bg-gray-900 border-r border-gray-700 z-50
              transform -translate-x-full transition-transform duration-300 ease-in-out
              flex flex-col overflow-hidden">

    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700 shrink-0">
        <span class="font-semibold text-white text-sm tracking-wide">Navigation</span>
        <button onclick="closeSidebar()"
                class="text-gray-400 hover:text-white transition-colors p-1 rounded hover:bg-gray-700"
                title="Fermer">✕</button>
    </div>

    <nav id="sidebar-pages-list" class="overflow-y-auto flex-1 py-2 px-2">
        {% for page in pages %}
        <div class="mb-1 page-item" data-id="{{ page.id }}">
            <div class="page-drag-handle flex items-center cursor-grab active:cursor-grabbing">
                <span class="text-gray-600 px-1 text-sm select-none shrink-0" title="Glisser pour réordonner">⠿</span>
                <a href="{% url 'index' page.slug %}"
                   onclick="closeSidebar()"
                   draggable="false"
                   class="flex-1 flex items-center gap-2 px-2 py-2 rounded text-sm font-semibold transition-colors cursor-pointer
                          {% if page == active_page %}bg-blue-600/20 text-blue-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">
                    <span class="text-gray-500 text-xs">▸</span>
                    {{ page.name }}
                </a>
            </div>
            <div class="sidebar-widget-dropzone ml-4 pl-3 border-l border-gray-700 mt-0.5 space-y-0.5 min-h-[4px]"
                 data-page-id="{{ page.id }}"
                 data-page-url="{% url 'index' page.slug %}">
                {% for widget in page.widgets.all %}
                <a href="{% url 'index' page.slug %}"
                   onclick="closeSidebar()"
                   data-widget-id="{{ widget.id }}"
                   class="flex items-center px-2 py-1 rounded text-xs transition-colors
                          text-gray-300 hover:bg-gray-800 hover:text-white cursor-grab active:cursor-grabbing">
                    {{ widget.title }}
                </a>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </nav>

    <div class="border-t border-gray-700 p-3 shrink-0">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full flex items-center gap-2 px-2 py-2 rounded text-sm font-semibold
                           text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="text-gray-500">⎋</span>
                Déconnexion
            </button>
        </form>
    </div>
</aside>
