<script>
    // --- SIDEBAR MENU ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-menu');
        const backdrop = document.getElementById('sidebar-backdrop');
        const isOpen = !sidebar.classList.contains('-translate-x-full');
        sidebar.classList.toggle('-translate-x-full', isOpen);
        backdrop.classList.toggle('hidden', isOpen);
    }

    function closeSidebar() {
        const sidebar = document.getElementById('sidebar-menu');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (sidebar) sidebar.classList.add('-translate-x-full');
        if (backdrop) backdrop.classList.add('hidden');
    }

   // --- GESTION DES MENUS CONTEXTUELS ---
    // ... (code pour afficher/cacher les menus au clic droit et mettr
    const widgetMenu = document.getElementById('widget-context-menu');

    function showWidgetMenu(e, widgetId) {
        e.preventDefault();
        e.stopPropagation();

        widgetMenu.style.left = e.clientX + 'px';
        widgetMenu.style.top = e.clientY + 'px';
        widgetMenu.classList.remove('hidden');

        document.querySelectorAll('.widget-move-form, .widget-width-form').forEach(form => {
            let baseAction = form.getAttribute('action');
            let newAction = baseAction.replace(/\/\d+\/$/, '/' + widgetId + '/');
            form.setAttribute('action', newAction);
        });
    }

    document.addEventListener('click', function(e) {
        if (widgetMenu && !widgetMenu.contains(e.target)) {
            widgetMenu.classList.add('hidden');
        }
        const linkMenu = document.getElementById('context-menu');
        if (linkMenu) linkMenu.style.display = 'none';
    });

    // --- GESTION DES MODALES (Popup) ---
    function toggleModal(modalId) {
       // ... (code pour afficher/cacher les modales et gérer le focus)
        const modal = document.getElementById(modalId);
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            const input = modal.querySelector('input');
            if(input) setTimeout(() => input.focus(), 100);
        } else {
            modal.classList.add('hidden');
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            document.querySelectorAll('[id^="modal-"]').forEach(modal => modal.classList.add('hidden'));
            document.querySelectorAll('[id^="form-"]').forEach(form => form.classList.add('hidden'));
            if(widgetMenu) widgetMenu.classList.add('hidden');
            closeSidebar();
        }
    });

    // --- PRÉPARATION SUPPRESSION ---
    function confirmDeleteWidget(widgetId) {
        const confirmBtn = document.getElementById('btn-confirm-delete-widget');
        confirmBtn.href = "/widget/delete/" + widgetId + "/";
        toggleModal('modal-delete-widget');
    }

    function confirmDeleteLink(linkId) {
        const confirmBtn = document.getElementById('btn-confirm-delete-link');
        confirmBtn.setAttribute('hx-get', `/link/delete/${linkId}/`);
        confirmBtn.setAttribute('hx-target', `#link-${linkId}`);
        confirmBtn.setAttribute('hx-swap', 'delete');
        htmx.process(confirmBtn);
        toggleModal('modal-delete-link');
    }

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.elt.id === 'btn-confirm-delete-link' && evt.detail.successful) {
            toggleModal('modal-delete-link');
        }
    });

    // --- AFFICHAGE FORMULAIRE LIEN ---
    function toggleForm(formId) {
        const form = document.getElementById(formId);
        if (form.classList.contains('hidden')) {
            form.classList.remove('hidden');
            form.querySelector('input').focus();
        } else {
            form.classList.add('hidden');
        }
    }

    // --- DRAG & DROP : LIENS ---
    document.querySelectorAll('.sortable-list').forEach(function(list) {
        new Sortable(list, {
            group: 'shared',
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                var targetList = evt.to;
                var widgetId = targetList.getAttribute('data-widget-id');
                var listItems = targetList.querySelectorAll('[data-id]');
                var linkIds = Array.from(listItems).map(li => li.getAttribute('data-id'));

                var formData = new FormData();
                formData.append('widget_id', widgetId);
                linkIds.forEach(id => formData.append('link', id));

                fetch('/api/update-order/', { method: 'POST', body: formData });
            }
        });
    });

    // --- DRAG & DROP : CATÉGORIES (Widgets) ---
    var widgetGrid = document.getElementById('widget-grid');
    if (widgetGrid) {
        new Sortable(widgetGrid, {
            animation: 150,
            handle: '.widget-handle',
            ghostClass: 'bg-gray-700',
            onEnd: function (evt) {
                var listItems = widgetGrid.children;
                var widgetIds = Array.from(listItems).map(div => div.getAttribute('data-id'));

                var formData = new FormData();
                widgetIds.forEach(id => formData.append('widget', id));

                fetch('/api/update-widget-order/', { method: 'POST', body: formData });
            }
        });
    }

    // --- DRAG & DROP : PAGES (Onglets) ---
    var navContainer = document.getElementById('main-nav');
    if (navContainer) {
        new Sortable(navContainer, {
            animation: 150,
            draggable: 'a', // On ne déplace que les liens (pas les boutons + / edit)
            ghostClass: 'bg-gray-600',
            onEnd: function (evt) {
                var itemEl = evt.item;
                var listItems = navContainer.querySelectorAll('a[data-id]');
                var pageIds = Array.from(listItems).map(el => el.getAttribute('data-id'));

                var formData = new FormData();
                pageIds.forEach(id => formData.append('page', id));

                fetch('/api/update-page-order/', { method: 'POST', body: formData });
            }
        });
    }

    // --- DRAG & DROP : CATÉGORIES (Sidebar) ---
    document.querySelectorAll('.sidebar-widget-dropzone').forEach(function(dropzone) {
        new Sortable(dropzone, {
            group: 'sidebar-widgets',
            animation: 150,
            ghostClass: 'sortable-ghost',
            emptyInsertThreshold: 20,
            forceFallback: true,
            onAdd: function(evt) {
                const widgetId = evt.item.dataset.widgetId;
                const pageId = evt.to.dataset.pageId;
                const pageUrl = evt.to.dataset.pageUrl;
                const csrfToken = JSON.parse(document.body.getAttribute('hx-headers'))['X-CSRFToken'];

                evt.item.href = pageUrl;

                const formData = new FormData();
                formData.append('target_page_id', pageId);
                fetch(`/widget/move/${widgetId}/`, {
                    method: 'POST',
                    headers: {'X-CSRFToken': csrfToken},
                    body: formData
                });
            }
        });
    });

    // --- MENU CONTEXTUEL : LIENS (Clic Droit) ---
    const linkMenu = document.getElementById('context-menu');
    let currentLinkId = null;

    function showContextMenu(e, linkId) {
        e.preventDefault();
        currentLinkId = linkId;
        linkMenu.style.left = e.pageX + 'px';
        linkMenu.style.top = e.pageY + 'px';
        linkMenu.style.display = 'block';
    }

    function moveLink(widgetId, pageId) {
        if (!currentLinkId) return;
        linkMenu.style.display = 'none';
        const csrfToken = JSON.parse(document.body.getAttribute('hx-headers'))['X-CSRFToken'];
        const formData = new FormData();
        if (widgetId) formData.append('target_widget_id', widgetId);
        if (pageId)   formData.append('target_page_id', pageId);
        fetch(`/api/move-link/${currentLinkId}/`, {
            method: 'POST',
            headers: {'X-CSRFToken': csrfToken},
            body: formData
        }).then(() => location.reload());
    }

    // --- COPIER SNIPPET ---
    function copySnippet(btn) {
        const cmd = btn.dataset.cmd;
        navigator.clipboard.writeText(cmd).then(() => {
            btn.classList.add('text-green-400');
            const icon = btn.innerHTML;
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            setTimeout(() => { btn.innerHTML = icon; btn.classList.remove('text-green-400'); }, 1500);
        });
    }

    // --- HORLOGE DIGITALE ---
    function updateClock() {
        const clockEl = document.getElementById('clock-display');
        const dateEl = document.getElementById('date-display');

            if (!clockEl) return;

        const now = new Date();

        // Heure locale
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${hours}:${minutes}`;
        dateEl.textContent = now.toLocaleDateString('fr-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Fonction helper pour formater l'heure selon le fuseau
        const getForeignTime = (timeZone) => {
            return new Intl.DateTimeFormat('fr-CA', {
                timeZone: timeZone,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).format(now);
        };

        // Horloges additionnelles (configurées via CLOCK_TIMEZONES dans .env)
        document.querySelectorAll('.clock-secondary[data-timezone]').forEach(el => {
            el.textContent = getForeignTime(el.dataset.timezone);
        });
    }

    if(document.getElementById('clock-display')) {
        setInterval(updateClock, 1000);
        updateClock();
    }


    // Configuration Open-Meteo (ville configurée via WEATHER_* dans .env)
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude={{ weather_lat }}&longitude={{ weather_lon }}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=${encodeURIComponent("{{ weather_timezone }}")}&forecast_days=4`;

    const WEATHER_ICONS = {
        0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
        51: '🌦️', 53: '🌦️', 55: '🌧️', 61: '🌧️', 63: '🌧️', 65: '⛈️',
        71: '🌨️', 73: '🌨️', 75: '❄️', 77: '🌨️',
        80: '🌦️', 81: '🌧️', 82: '⛈️', 85: '🌨️', 86: '❄️',
        95: '⛈️', 96: '⛈️', 99: '⛈️',
    };

    const WEATHER_DESC = {
        0: 'Ciel dégagé', 1: 'Peu nuageux', 2: 'Partiellement nuageux', 3: 'Couvert',
        45: 'Brouillard', 48: 'Brouillard givrant',
        51: 'Bruine légère', 53: 'Bruine modérée', 55: 'Bruine dense',
        61: 'Pluie légère', 63: 'Pluie modérée', 65: 'Pluie forte',
        71: 'Neige légère', 73: 'Neige modérée', 75: 'Neige forte', 77: 'Grésil',
        80: 'Averses légères', 81: 'Averses modérées', 82: 'Averses violentes',
        85: 'Averses de neige', 86: 'Averses de neige forte',
        95: 'Orage', 96: 'Orage avec grêle', 99: 'Orage violent',
    };

    const DAYS = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
    function getDayName(dateString) {
        return DAYS[new Date(dateString + 'T12:00:00').getDay()];
    }

    async function fetchWeather() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const c = data.current;

            document.getElementById('current-temp').innerText = Math.round(c.temperature_2m) + '°C';
            document.getElementById('current-desc').innerText = WEATHER_DESC[c.weather_code] || '—';
            document.getElementById('current-feels').innerText = `Ressenti ${Math.round(c.apparent_temperature)}°C`;
            document.getElementById('current-humidity').innerText = `💧 ${c.relative_humidity_2m}%`;
            document.getElementById('current-wind').innerText = `💨 ${Math.round(c.wind_speed_10m)} km/h`;

            const grid = document.getElementById('forecast-grid');
            grid.innerHTML = '';

            for (let i = 1; i < 4; i++) {
                const dayName = getDayName(data.daily.time[i]);
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                const icon = WEATHER_ICONS[data.daily.weather_code[i]] || '❓';
                const precip = data.daily.precipitation_probability_max[i] ?? 0;
                const precipColor = precip >= 60 ? 'text-blue-400' : precip >= 30 ? 'text-blue-300' : 'text-gray-600';

                grid.innerHTML += `
                    <div class="flex flex-col items-center p-2 rounded hover:bg-gray-700/50 transition-colors">
                        <span class="text-gray-400 text-xs uppercase font-bold mb-1">${dayName}</span>
                        <span class="text-xl mb-1">${icon}</span>
                        <div class="text-sm font-bold text-white">${maxTemp}° <span class="text-gray-500 text-xs font-normal">| ${minTemp}°</span></div>
                        <div class="text-xs mt-0.5 ${precipColor}">💧 ${precip}%</div>
                    </div>
                `;
            }

        } catch (error) {
            console.error('Erreur Météo:', error);
            const desc = document.getElementById('current-desc');
            if (desc) desc.innerText = 'Erreur de chargement';
        }
    }

    fetchWeather();
    setInterval(fetchWeather, 1800000);


    // --- MODE ZEN ---
    function toggleZenMode() {
        const body = document.body;
        body.classList.toggle('zen-mode');
        const isZen = body.classList.contains('zen-mode');
        localStorage.setItem('zenMode', isZen);
        const btn = document.querySelector('#zen-toggle-btn svg path');
        if (isZen) {
            btn.setAttribute('d', 'M6 18L18 6M6 6l12 12');
        } else {
            btn.setAttribute('d', 'M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (localStorage.getItem('zenMode') === 'true') {
            toggleZenMode();
        }
    });

    // --- CALENDRIER ---
    (function() {
        const date = new Date();
        const currYear = date.getFullYear();
        const currMonth = date.getMonth();
        const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

        const title = document.getElementById('cal-month-year');
        const grid = document.getElementById('cal-days');

        if(title && grid) {
            title.innerText = `${monthNames[currMonth]} ${currYear}`;
            let firstDay = new Date(currYear, currMonth, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1;
            const lastDate = new Date(currYear, currMonth + 1, 0).getDate();

            let html = "";
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="p-1"></div>`;
            }
            for (let i = 1; i <= lastDate; i++) {
                let isToday = (i === date.getDate() && currMonth === new Date().getMonth() && currYear === new Date().getFullYear());
                let classes = isToday
                    ? "bg-blue-600 text-white font-bold shadow-md transform scale-110 rounded-full w-8 h-8 flex items-center justify-center mx-auto"
                    : "text-gray-300 hover:bg-gray-700 rounded-full w-8 h-8 flex items-center justify-center mx-auto transition-colors cursor-default";
                html += `<div class="${classes}">${i}</div>`;
            }
            grid.innerHTML = html;
        }
    })();

    // --- OPEN ALL LINKS ---
    function openAllLinks(widgetId) {
        const widgetContainer = document.querySelector(`div[data-id="${widgetId}"]`);
        if (!widgetContainer) return;

        const links = widgetContainer.querySelectorAll('ul.sortable-list a');

        if (links.length > 5) {
            if (!confirm(`Voulez-vous ouvrir ${links.length} onglets ?`)) return;
        }

        Array.from(links).forEach((link, index) => {
            if (link.href) {
                setTimeout(() => {
                    window.open(link.href, '_blank');
                }, 150 * index);
            }
        });
    }

    // --- RECHERCHE GLOBALE ---
    (function () {
        const input = document.getElementById('search-input');
        const results = document.getElementById('search-results');
        if (!input || !results) return;

        // Echap : vide l'input et ferme le dropdown
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                input.value = '';
                results.innerHTML = '';
            }
        });

        // Clic en dehors : ferme le dropdown
        document.addEventListener('click', function (e) {
            if (!document.getElementById('search-wrapper').contains(e.target)) {
                results.innerHTML = '';
            }
        });
    })();

    // --- REINIT SORTABLE APRES HTMX LOAD ---
    htmx.onLoad(function(content) {
        var sortables = content.querySelectorAll('.sortable-list');
        sortables.forEach(function(list) {
             new Sortable(list, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    var targetList = evt.to;
                    var widgetId = targetList.getAttribute('data-widget-id');
                    var listItems = targetList.querySelectorAll('li');
                    var linkIds = Array.from(listItems).map(li => li.getAttribute('data-id'));
                    var formData = new FormData();
                    formData.append('widget_id', widgetId);
                    linkIds.forEach(id => formData.append('link', id));
                    fetch('/api/update-order/', { method: 'POST', body: formData });
                }
            });
        });
    });

</script>
